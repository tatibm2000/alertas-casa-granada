# Monitor de viviendas en GitHub Actions: cada 15 minutos ejecuta un ciclo
# ("python -m monitor once") y guarda la base de datos en la caché de Actions
# para la siguiente vez.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN   token del bot
#   TELEGRAM_CHAT_ID     id del grupo (p. ej. -1004382996213)  -> solo pisos
#   TELEGRAM_ADMIN_CHAT_ID  tu chat privado con el bot          -> incidencias y estado
#
# La programación de GitHub no es puntual (a veces pasan horas). Para que sea de verdad
# cada 15 min, cron-job.org llama al botón "Run workflow" (ver README). El "schedule" de
# abajo queda solo como respaldo.
#
# El job corre dentro de la imagen oficial de Playwright (ya trae Chromium y sus
# dependencias instaladas), así evitamos el "apt install" que a veces falla por
# problemas de DNS en los servidores de Ubuntu de GitHub. La versión de la imagen
# (v1.65.0) debe coincidir con la versión fijada en requirements.txt.

name: monitor

on:
  schedule:
    - cron: "7 */2 * * *"      # respaldo: cada 2 h (hora UTC)
  workflow_dispatch:            # botón "Run workflow" para lanzarlo a mano
    inputs:
      comando:
        description: "once (ciclo normal), resumen, ejemplo, estado, telegram-test o check --source id1,id2 (prueba)"
        default: once

concurrency:                    # nunca dos ejecuciones a la vez (compartirían la BD)
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write               # solo para el "keepalive" de abajo

jobs:
  ciclo:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # La base de datos vive en la caché de Actions: cada ejecución restaura la última
      # y guarda una nueva. Si algún día se perdiera, el monitor vuelve a "sembrar" en
      # silencio (no reenvía todo), así que no pasa nada grave.
      - name: Recuperar base de datos
        uses: actions/cache/restore@v4
        with:
          path: data/monitor.sqlite
          key: bd-${{ github.run_id }}
          restore-keys: bd-

      - name: Ejecutar monitor
        run: python -m monitor ${{ github.event.inputs.comando || 'once' }}

      # Con "check": las páginas de diagnóstico (webs sin anuncios) se pueden descargar
      # al final de la ejecución, en "Artifacts".
      - name: Guardar diagnósticos
        if: always() && hashFiles('data/debug_*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos
          path: data/debug_*
          retention-days: 7

      - name: Guardar base de datos
        if: always() && hashFiles('data/monitor.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/monitor.sqlite
          key: bd-${{ github.run_id }}

      # GitHub desactiva las tareas programadas de un repo público tras 60 días sin
      # cambios. Si el último commit tiene más de 45 días, hacemos uno vacío.
      - name: Keepalive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
