# ------------------------------------------------------------------
#  Monitor de viviendas · provincia de Granada
#  Edita este archivo y reinicia el servicio:  sudo systemctl restart granada-monitor
# ------------------------------------------------------------------

criteria:
  max_price: 220000        # precio objetivo (≤)
  min_rooms: 3             # habitaciones mínimas (≥)
  min_price: 100000        # precio mínimo (≥)
  exclude_types:           # además de garajes, terrenos, solares, parcelas, locales, naves,
    - cochera              # oficinas, trasteros y edificios (ya excluidos por defecto)
    - plaza de garaje
    - finca rustica
  fallback: false           # regla de rescate: si un portal no tiene nada en rango, avisa del
                           # más reciente con min_rooms+ hab y precio ≥ min_price (vivienda)
  price_drop_min_pct: 1    # avisar de bajadas de precio de al menos este %
  zona:                    # lista cerrada: solo se avisa de viviendas en estos municipios
    - Maracena             # (quita la sección entera para volver a toda la provincia;
    - Albolote             #  para añadir la capital, añade una línea "- Granada")
    - Armilla
    - Churriana de la Vega
    - Las Gabias
    - Cúllar Vega
    - Vegas del Genil
    - Alhendín
    - Otura
    - Ogíjares
    - Gójar
    - La Zubia
    - Huétor Vega
    - Cájar
    - Monachil

interval_minutes: 15       # cada cuánto se revisan las webs
timezone: Europe/Madrid
quiet_hours: [0, 8]        # de 00:00 a 08:00 los mensajes llegan sin sonido (quitar la línea para desactivar)
heartbeat_hour: 9          # resumen diario "sigo vivo" a partir de esta hora (quitar para desactivar)
fail_alert_after: 3        # avisar si una web falla N veces seguidas
enrich_limit_per_source: 12  # fichas máximas que se abren por web y ciclo
database: data/monitor.sqlite

# kind = tipo de conector (ver monitor/sources). every = cada cuántos ciclos se revisa.
sources:
