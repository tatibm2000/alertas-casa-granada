    list_url: https://www.tecnocasa.es/venta/inmuebles/andalucia/granada.html?min_price=100000&max_price=220000&min_rooms=3&sort=Aggiornamento|DESC
    quick_pages: 2           # páginas que se leen en cada ciclo (lo nuevo sale arriba)
    full_every: 16           # cada 16 ciclos (~4 h) se recorre el listado filtrado entero
