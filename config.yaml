    base_url: https://www.webparainmobiliarias.com.es/frame-clientes/9329
    geo_check: true          # también publica en Madrid: se filtra por municipio

  - id: donpiso
    name: DonPiso Granada
    kind: donpiso
    list_url: https://www.donpiso.com/venta-casas-y-pisos/granada/listado

